server:
  port: ${DRONE_DELIVERY_SERVICE_PORT:8088}

springdoc:
  api-docs:
    version: "openapi_3_0"
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

spring:
  application:
    name: drone-delivery
  data:
    web:
      pageable:
        # Bound client-controlled page sizes to protect the DB from oversized fetches.
        max-page-size: 100
        default-page-size: 20
  mvc:
    problemdetails:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:acme}?currentSchema=${DRONE_DELIVERY_SCHEMA:drone_delivery}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    # HikariCP Connection Pool Configuration
    # Optimized for production workloads with proper connection management
    hikari:
      # Maximum number of connections in the pool
      # Rule of thumb: (core_count * 2) + effective_spindle_count
      # For typical deployment: 20 connections handles ~200 concurrent requests
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      # Minimum number of idle connections maintained in the pool
      # Keeps connections ready for burst traffic
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      # Maximum time (ms) a client will wait for a connection from the pool
      # 30 seconds timeout prevents indefinite blocking
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      # Maximum time (ms) a connection can sit idle in the pool
      # 10 minutes - connections idle longer are removed
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      # Maximum lifetime (ms) of a connection in the pool
      # 30 minutes - prevents stale connections and database-side timeouts
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      # Connection leak detection threshold (ms)
      # Logs warning if connection held longer than 60 seconds
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      # Connection pool name for monitoring and logging
      pool-name: DroneDeliveryHikariPool
      # Enable auto-commit for connections (default: true)
      auto-commit: true
      # Connection test query (PostgreSQL specific)
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        # Enable JDBC batch processing for better performance
        jdbc:
          batch_size: 20
        # Enable query plan caching
        query:
          plan_cache_max_size: 2048
    database: postgresql
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
  sql.init.mode: always
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: ${DRONE_DELIVERY_SCHEMA:drone_delivery}
    clean-disabled: false

# JWT Configuration
jwt:
  # No default on purpose: JWT_SECRET must be supplied via the environment so the app never
  # boots with a publicly-known signing key. Startup fails fast if it is unset.
  # Must be at least 256 bits (32+ characters) for the HS256 algorithm.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

