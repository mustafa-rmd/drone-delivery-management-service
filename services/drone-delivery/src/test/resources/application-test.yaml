spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/Acme_test?currentSchema=drone_delivery
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: drone_delivery

jwt:
  secret: test-secret-key-for-testing-purposes-minimum-256-bits-required-for-hs256-algorithm
  expiration: 86400000

